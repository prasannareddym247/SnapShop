<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Placed</title></head>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:20px"><tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08)">
<tr><td style="background:#1B4332;padding:24px;text-align:center"><h1 style="color:#ffffff;margin:0;font-size:22px">SnapShop</h1></td></tr>
<tr><td style="padding:32px 24px">
<h2 style="color:#1B4332;margin:0 0 8px">Order placed successfully!</h2>
<p style="color:#555;font-size:15px;line-height:1.5;margin:0 0 20px">Hi {{userName}},</p>
<p style="color:#555;font-size:15px;line-height:1.5;margin:0 0 16px">Your order <strong>#{{orderId}}</strong> has been placed and is being processed.</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f0fdf4;border-radius:6px;padding:16px;margin:0 0 20px">
<tr><td style="padding:8px 16px;color:#555;font-size:14px">Order ID</td><td style="padding:8px 16px;font-weight:600;color:#1B4332;font-size:14px">#{{orderId}}</td></tr>
<tr><td style="padding:8px 16px;color:#555;font-size:14px">Items</td><td style="padding:8px 16px;font-weight:600;color:#1B4332;font-size:14px">{{itemsCount}}</td></tr>
<tr><td style="padding:8px 16px;color:#555;font-size:14px">Total</td><td style="padding:8px 16px;font-weight:700;color:#1B4332;font-size:16px">₹{{totalAmount}}</td></tr>
</table>
<p style="color:#888;font-size:13px;line-height:1.5;margin:0">We'll notify you when your order ships.</p>
</td></tr>
<tr><td style="background:#f8fafc;padding:16px 24px;text-align:center"><p style="color:#999;font-size:12px;margin:0">&copy; 2026 SnapShop. All rights reserved.</p></td></tr>
</table></td></tr></table>
</body>
</html>
